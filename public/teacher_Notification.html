<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher - Announcements & Notifications</title>
    <link rel="stylesheet" href="shared-portal.css">
    <link rel="stylesheet" href="Teacher_Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .notificationLayout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 25px;
        }
        @media (max-width: 900px) {
            .notificationLayout {
                grid-template-columns: 1fr;
            }
        }
        .formCard {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
        }
        .formGroup {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .formGroup label {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
        }
        .formGroup input, .formGroup select, .formGroup textarea {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
            color: #ffffff;
            font-size: 14px;
        }
        .submitBtn {
            background: #00bcd4;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submitBtn:hover {
            background: #008ba3;
        }
    </style>
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>

        <div class="dashboardContainer DashboardPart" id="dashboardContainer" style="padding: 25px; overflow-y: auto; height: 94vh;">
            <h1 class="dashboardHeader" style="margin: 0 0 8px 0; color: #fff;">Announcements & Notifications</h1>
            <p style="color: #94a3b8; margin: 0 0 25px 0; font-size: 14px;">Publish notices for your classes, broadcast exam/assignment alerts, and monitor past updates.</p>

            <div class="notificationLayout">
                <!-- Create Notice Form -->
                <div>
                    <div class="formCard">
                        <h2 style="margin: 0 0 16px 0; color: #fff; font-size: 18px;"><i class="fa fa-bullhorn" style="color: #00bcd4;"></i> Post New Announcement</h2>
                        <form onsubmit="handleCreateAnnouncement(event)">
                            <div class="formGroup">
                                <label>Target Audience / Class</label>
                                <select id="announcementSubjectSelect">
                                    <option value="">All My Classes & Students</option>
                                </select>
                            </div>
                            <div class="formGroup">
                                <label>Notice Headline / Title</label>
                                <input type="text" id="announcementTitle" placeholder="e.g. Revision Session Schedule for Next Week" required>
                            </div>
                            <div class="formGroup">
                                <label>Message / Details</label>
                                <textarea id="announcementMessage" rows="5" placeholder="Write announcement details here..." required></textarea>
                            </div>
                            <button type="submit" class="submitBtn"><i class="fa fa-paper-plane"></i> Publish Notice</button>
                        </form>
                    </div>
                </div>

                <!-- Past Announcements Feed -->
                <div>
                    <h2 style="margin: 0 0 16px 0; color: #fff; font-size: 18px;"><i class="fa fa-history" style="color: #38bdf8;"></i> Your Published Announcements</h2>
                    <div id="announcementsFeedContainer">
                        <p style="color: #94a3b8; padding: 20px;">Loading notices...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="teacher_notification.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar("notifications", "teacher");
        });
    </script>
</body>

</html>
