<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="Teacher_Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body id="body">
    <div class="layoutDashboard">
        <nav class="topNavBar DashboardPart">
            <h3 class="dashboardMainText">Teacher Dashboard</h3>
            <div class="navBarMiddle">
                <a class="navLink" id="dashboard"><i class="fas fa-file-alt"></i> Dashboard</a>
                <a class="navLink" id="class"><i class="fas fa-chalkboard-teacher"></i> Classes</a>
                <a class="navLink" id="exam"><i class="fas fa-file-alt"></i> Exams</a>
                <a class="navLink" id="timeTable"><i class="fas fa-calendar-alt"></i> TimeTable</a>
                <a class="navLink" id="assignment"><i class="fas fa-tasks"></i> Assignments</a>
            </div>
            <div class="NavBarFooter">
                <a class="navLink"><i class="fas fa-cog"></i> Settings</a>
                <a class="navLink"><i class="fas fa-user"></i> Profile</a>
                <a class="navLink logOutButton"><i class="fas fa-sign-out-alt"></i> Log Out</a>
            </div>
        </nav>
        <div class="dashboardContainer DashboardPart" id="dashboardContainer">
            <div class="notificationCardContainer">
                <div class="notificationCard">View Notifications</div>
                <div class="notificationCard">Create Notification</div>
                <div class="notificationCard">Manage Notifications</div>
                <div class="notificationCard">Notification Settings</div>
            </div>
        </div>
    </div>
</body>
<script src="dashboard.js"></script>
<script src="teacher_Dashboard.js"></script>

</html>
