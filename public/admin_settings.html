<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Admin Portal</title>
    <link rel="stylesheet" href="Teacher_Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .settingsCard {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 30px;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            max-width: 800px;
        }

        .settingsHeader {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .formGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .formGrid {
                grid-template-columns: 1fr;
            }
        }

        .formGroup {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .formGroup label {
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }

        .formGroup input,
        .formGroup select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #1e293b;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .formGroup input:focus,
        .formGroup select:focus {
            border-color: #00bcd4;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.3);
        }

        .saveBtn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: #00bcd4;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .saveBtn:hover {
            background: #00acc1;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.4);
        }
    </style>
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>

        <div class="dashboardContainer DashboardPart" id="dashboardContainer" style="padding: 30px; overflow-y: auto; height: 94vh;">
            <div style="margin-bottom: 25px;">
                <h2 style="color: #ffffff; margin: 0; font-size: 26px; font-weight: 800;">
                    <i class="fa fa-sliders" style="color: #00bcd4;"></i> Institutional System Settings
                </h2>
                <p style="color: #94a3b8; margin: 5px 0 0 0; font-size: 14px;">
                    Configure academy information, academic year calendars, term schedules, and global contact parameters.
                </p>
            </div>

            <div class="settingsCard">
                <div class="settingsHeader">
                    <h3 style="margin: 0 0 5px 0; font-size: 18px; color: #ffffff;"><i class="fa fa-school" style="color: #38bdf8;"></i> Academy & Academic Calendar</h3>
                    <p style="margin: 0; font-size: 13px; color: #94a3b8;">These details are reflected across student and teacher portal headers.</p>
                </div>

                <form onsubmit="handleSaveSettings(event)">
                    <div class="formGrid">
                        <div class="formGroup" style="grid-column: 1 / -1;">
                            <label>School / Institution Name</label>
                            <input type="text" id="settingSchoolName" required placeholder="e.g. Apex International Academy">
                        </div>
                        <div class="formGroup">
                            <label>Academic Year</label>
                            <input type="text" id="settingAcademicYear" required placeholder="e.g. 2026-2027">
                        </div>
                        <div class="formGroup">
                            <label>Current Term / Semester</label>
                            <input type="text" id="settingCurrentTerm" required placeholder="e.g. Term 2">
                        </div>
                        <div class="formGroup">
                            <label>Term Start Date</label>
                            <input type="date" id="settingTermStartDate">
                        </div>
                        <div class="formGroup">
                            <label>Term End Date</label>
                            <input type="date" id="settingTermEndDate">
                        </div>
                        <div class="formGroup">
                            <label>Official School Email</label>
                            <input type="email" id="settingSchoolEmail" placeholder="admin@school.com">
                        </div>
                        <div class="formGroup">
                            <label>Official Contact Telephone</label>
                            <input type="text" id="settingSchoolPhone" placeholder="+1 800 555 0199">
                        </div>
                        <div class="formGroup" style="grid-column: 1 / -1;">
                            <label>Campus Address</label>
                            <input type="text" id="settingSchoolAddress" placeholder="100 Knowledge Way, City, State">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end;">
                        <button type="submit" class="saveBtn"><i class="fa fa-save"></i> Save System Settings</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="admin_settings.js"></script>
</body>

</html>
