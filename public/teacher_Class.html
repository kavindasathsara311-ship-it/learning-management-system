<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher - Manage Classes</title>
    <link rel="stylesheet" href="Teacher_Dashboard.css">
    <link rel="stylesheet" href="teacher_class.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>
        <div class="dashboardContainer DashboardPart classContainer" id="dashboardContainer">
            <h1 class="dashboardHeader">Classes & Teaching Subjects</h1>
            <div class="classCardContainer" id="classCardContainer">
                <div class="classCard" id="viewClasses">View Classes & Materials</div>
                <div class="classCard" id="createClass">Assign New Class</div>
                <div class="classCard" id="manageClass">Upload Lesson Notes & Assignments</div>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
    <script src="teacher_class.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar("classes", "teacher");
        });
    </script>
</body>

</html>
