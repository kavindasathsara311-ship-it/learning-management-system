<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Student_Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body id="body">
    <div class="layoutDashboard">
        <nav class="topNavBar DashboardPart" id="topNavBar">
            <h1 class="dashboardMainText">School Name</h1>
                <div class="navBarMiddle">
                    <a class="navLink middleLinks" id="subjectNavLink"><i class="fa fa-book" style="font-size:16px"></i>Subjects</a>
                    <a class="navLink middleLinks" id="examsNavLink"><i class="fa fa-calendar" style="font-size:16px"></i>Exams</a>
                    <a class="navLink middleLinks" id="timeTableNavLink"><i class="fa fa-clock" style="font-size:16px"></i>TimeTable</a>
                    <a class="navLink middleLinks" id="attendanceNavLink"><i class="fa fa-book" style="font-size:16px"></i>Attendencs</a>
                    <a class="navLink middleLinks" id="notificationNavLink"><i class="fa fa-bell" style="font-size:16px"></i>Notifications</a>
                </div>
                <div class="NavBarFooter">
                    <a class="navLink footerNavLink"><i class="fa fa-cog" style="font-size:16px"></i>Settings</a>
                    <a class="navLink footerNavLink"><i class="fa fa-user" style="font-size:16px"></i>Profile</a>
                    <a class="navLink logOutButton footerNavLink"><i class="fa fa-sign-out" style="font-size:16px"></i>Log Out</a>
                </div>
        </nav>
        <div class="dashboardContainer DashboardPart" id="dashboardContainer">
            <div>
                <i id="timeIcon" class="fa-solid fa-sun" style="font-size: 60px;"></i>
                <h1 id="greeting">Good Morning</h1>
                <h1 class="welcomeText">Welcome <span id="studentName">Student Name</span></h1>
            </div>
            <h3 class="dashboardNameText" id="dashboardMainText">Dashboard</h3>
            <div class="cards-container">
                <div class="card">
                    <h2 class="cardTitle">Subjects</h2>
                    <p class="subjectCount">12</p>
                </div>
                <div class="card">
                    <h2 class="cardTitle">Exams</h2>
                    <p class="upEx">2 Upcoming Exams</p>
                </div>
                <div class="card">
                    <h2 class="cardTitle">TimeTable</h2>
                    <p class="Attendecs">92%</p>
                </div>
                <div class="upcomingAssigmentContainer">
                    <p>Assignments upcoming</p>
                </div>
                <div class="announcementContainer">

                </div>
            </div>
        </div>

    <script src="dashboard.js"></script>
    <script src="student_dashboard.js"></script>
</body>

</html>
