<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - LMS</title>
    <link rel="stylesheet" href="Student_Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>

        <div class="dashboardContainer DashboardPart" id="dashboardContainer">
            <!-- Header Greeting Section -->
            <div class="dashGreetingBanner">
                <div class="dashGreetingLeft">
                    <div class="dashGreetingIconBox">
                        <i id="timeIcon" class="fa-solid fa-sun"></i>
                    </div>
                    <div>
                        <h1 id="greeting" class="dashGreetingTitle">Good Morning</h1>
                        <p class="dashGreetingSubtitle">Welcome back, <span id="studentName" class="dashStudentName">Student</span>!</p>
                    </div>
                </div>
            </div>

            <!-- Overview KPI Metric Cards -->
            <div class="dashKpiGrid">
                <div class="dashKpiCard" onclick="window.location.href='student_subject.html'">
                    <div class="dashKpiIcon iconBlue">
                        <i class="fa fa-book"></i>
                    </div>
                    <div class="dashKpiInfo">
                        <span class="dashKpiLabel">Enrolled Subjects</span>
                        <h3 class="dashKpiValue" id="subjectsCount">--</h3>
                    </div>
                </div>

                <div class="dashKpiCard" onclick="window.location.href='student_exam.html'">
                    <div class="dashKpiIcon iconOrange">
                        <i class="fa fa-calendar-check"></i>
                    </div>
                    <div class="dashKpiInfo">
                        <span class="dashKpiLabel">Upcoming Exams</span>
                        <h3 class="dashKpiValue" id="examsCount">--</h3>
                    </div>
                </div>

                <div class="dashKpiCard" onclick="window.location.href='student_Attendence.html'">
                    <div class="dashKpiIcon iconGreen">
                        <i class="fa fa-chart-pie"></i>
                    </div>
                    <div class="dashKpiInfo">
                        <span class="dashKpiLabel">Attendance Rate</span>
                        <h3 class="dashKpiValue" id="attendanceRate">--%</h3>
                    </div>
                </div>

                <div class="dashKpiCard" onclick="window.location.href='student_timetable.html'">
                    <div class="dashKpiIcon iconPurple">
                        <i class="fa fa-clock"></i>
                    </div>
                    <div class="dashKpiInfo">
                        <span class="dashKpiLabel">Today's Schedule</span>
                        <h3 class="dashKpiValue" id="todayClassesCount">--</h3>
                    </div>
                </div>
            </div>

            <!-- Two Column Widget Area -->
            <div class="dashWidgetGrid">
                <!-- Upcoming Assignments Section -->
                <div class="dashWidgetCard">
                    <div class="dashWidgetHeader">
                        <div class="dashWidgetTitle">
                            <i class="fa fa-tasks" style="color: #00bcd4;"></i>
                            <span>Upcoming Assignments</span>
                        </div>
                        <a href="student_assignments.html" class="dashWidgetViewAll">View All <i class="fa fa-arrow-right"></i></a>
                    </div>
                    <div class="dashWidgetList" id="assignmentsContainer">
                        <p style="color: #64748b; padding: 15px;">Loading assignments...</p>
                    </div>
                </div>

                <!-- Recent Announcements Section -->
                <div class="dashWidgetCard">
                    <div class="dashWidgetHeader">
                        <div class="dashWidgetTitle">
                            <i class="fa fa-bullhorn" style="color: #f59e0b;"></i>
                            <span>School Announcements</span>
                        </div>
                        <a href="student_notification.html" class="dashWidgetViewAll">View All <i class="fa fa-arrow-right"></i></a>
                    </div>
                    <div class="dashWidgetList" id="announcementsContainer">
                        <p style="color: #64748b; padding: 15px;">Loading announcements...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="student_dashboard_home.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar("dashboard");
            initDashboardHome();
        });
    </script>
</body>

</html>
