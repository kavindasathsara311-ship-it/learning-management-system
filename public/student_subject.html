<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects & Course Materials - LMS</title>
    <link rel="stylesheet" href="shared-portal.css">
    <link rel="stylesheet" href="Student_Dashboard.css">
    <link rel="stylesheet" href="Student_Subject.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>

        <div class="subjectContainer DashboardPart" id="dashboardContainer">
            <div style="padding: 25px 25px 0 25px;">
                <h2 class="subjectContainerHeading" style="margin: 0; color: #0f172a;">Subjects & Learning Materials</h2>
                <p style="color: #64748b; margin-top: 5px; font-size: 14px;">Browse enrolled subjects, explore uploaded lesson notes, and download study resources.</p>
            </div>

            <div style="padding: 0 25px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <input type="text" class="subjectSearchInput" id="subjectSearchInput" placeholder="Search for subjects..." style="flex: 1; min-width: 200px; margin: 15px 0;">  
                <button class="searchButton" id="clearSearchButton" onclick="searchSubjects()" style="margin: 0; width: auto; height: 42px;">
                    <i class="fa fa-magnifying-glass"></i> Search
                </button>
                <button class="viewEnrolledSubjects" id="viewEnrolledSubjectsButton" onclick="viewEnrolledSubjects()" style="margin: 0; height: 42px;">
                    <i class="fa fa-book-bookmark"></i> Enrolled Subjects
                </button>
                <button class="viewEnrolledSubjects" style="margin: 0; background: #00bcd4; height: 42px;" onclick="viewAllMaterials()">
                    <i class="fa fa-folder-open"></i> All Course Materials
                </button>
            </div>

            <div class="subjectCardContainer" style="padding: 25px;">
                <!-- Subject cards add to here -->
            </div>
        </div>

        <div class="searchedSubjectContainer DashboardPart" id="searchedSubjectContainer">
            <h3 class="searchedSubjectContainerHeading">Enter Subject Code: <span id="subjectNameSpan">subject</span></h3>
            <input type="text" class="subjectSearchInput enrolleInput" id="subjectCodeInput" placeholder="Enter Subject Code">
            <button class="submitButton" id="enrollButton" onclick="enrollInSubject()">Enroll</button>
        </div>
    </div>

    <!-- Course Materials Modal -->
    <div class="matModalOverlay" id="courseMaterialsModal">
        <div class="matModalCard">
            <div class="matModalHeader">
                <h3 id="matModalTitle"><i class="fa fa-folder-open" style="color: #38bdf8;"></i> Course Materials</h3>
                <button class="matCloseBtn" onclick="closeMaterialsModal()"><i class="fa fa-times"></i></button>
            </div>
            <div class="matModalBody" id="matModalBody">
                <p style="color: #64748b; text-align: center; padding: 20px;">Loading course materials...</p>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="student_dashboard.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar("subjects");
            viewEnrolledSubjects();
        });
    </script>
</body>

</html>
