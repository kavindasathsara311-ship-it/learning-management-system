<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher - Assignment Management & Grading</title>
    <link rel="stylesheet" href="Teacher_Dashboard.css">
    <link rel="stylesheet" href="teacher_class.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .modalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modalCard {
            background: #ffffff;
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .modalHeader {
            padding: 20px 24px;
            background: #1e293b;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modalHeader h3 {
            margin: 0;
            font-size: 17px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .closeModalBtn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }
        .closeModalBtn:hover {
            color: #ffffff;
        }
        .modalBody {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }
    </style>
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>

        <div class="dashboardContainer DashboardPart" id="dashboardContainer" style="padding: 25px; overflow-y: auto; height: 94vh;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <div>
                    <h1 class="dashboardHeader" style="margin: 0; color: #fff;">Assignment Management & Grading</h1>
                    <p style="color: #94a3b8; margin-top: 5px; font-size: 14px;">Review submissions across your teaching subjects and submit student grades with feedback.</p>
                </div>
                <a href="teacher_Class.html" style="background: #00bcd4; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px;">
                    <i class="fa fa-plus"></i> New Assignment (via Class)
                </a>
            </div>

            <div id="assignmentsTableContainer">
                <p style="color: #94a3b8; padding: 20px;">Loading assignments...</p>
            </div>
        </div>
    </div>

    <!-- Grading Modal -->
    <div class="modalOverlay" id="gradingModal">
        <div class="modalCard">
            <div class="modalHeader">
                <h3 id="gradingModalTitle"><i class="fa fa-tasks" style="color: #38bdf8;"></i> Review & Grade Submissions</h3>
                <button class="closeModalBtn" onclick="closeGradingModal()"><i class="fa fa-times"></i></button>
            </div>
            <div class="modalBody" id="gradingModalBody">
                <p style="color: #64748b; text-align: center; padding: 20px;">Loading student submissions...</p>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="teacher_assignment.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar("assignments", "teacher");
        });
    </script>
</body>

</html>
