<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher - Daily Attendance</title>
    <link rel="stylesheet" href="Teacher_Dashboard.css">
    <link rel="stylesheet" href="teacher_Attendence.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .controlBar {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 20px;
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .controlGroup {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .controlGroup label {
            font-size: 12px;
            color: #bbb;
            text-transform: uppercase;
            font-weight: bold;
        }
        .controlGroup select, .controlGroup input {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #1e293b;
            color: #fff;
            font-size: 14px;
        }
        .actionBtn {
            padding: 9px 18px;
            border-radius: 6px;
            border: none;
            background: #00bcd4;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
        }
        .actionBtn:hover {
            background: #008ba3;
        }
        .actionBtn.markAll {
            background: #4CAF50;
        }
        .attendanceGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .summaryCard {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .summaryCard h4 {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
        }
        .summaryCard .num {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
        }
        .tableContainer {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
            color: #fff;
        }
        .tableContainer th, .tableContainer td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tableContainer th {
            background: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            text-transform: uppercase;
        }
        .statusGroup {
            display: flex;
            gap: 15px;
        }
        .statusOption {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-present { background: #4CAF50; color: #fff; }
        .badge-absent { background: #f44336; color: #fff; }
        .badge-late { background: #ff9800; color: #fff; }
        .reasonBox {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #e0e0e0;
        }
    </style>
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>

        <div class="dashboardContainer DashboardPart" id="dashboardContainer" style="padding: 25px; overflow-y: auto; height: 94vh;">
            <h2 style="color: #fff; margin: 0 0 15px 0;"><i class="fas fa-calendar-check" style="color: #00bcd4;"></i> Student Attendance Portal</h2>

            <!-- In-Charge vs View-Only Role Banner -->
            <div id="attendanceRoleBanner"></div>

            <div class="controlBar">
                <div class="controlGroup" style="flex: 1.5; min-width: 260px;">
                    <label>Select Class / Subject</label>
                    <select id="gradeSelect" onchange="loadTeacherAttendance()">
                        <option value="">Loading attendance classes...</option>
                    </select>
                </div>
                <div class="controlGroup" style="flex: 1; min-width: 150px;">
                    <label>Select Date</label>
                    <input type="date" id="attendanceDate" onchange="loadTeacherAttendance()">
                </div>
                <button class="actionBtn" onclick="loadTeacherAttendance()"><i class="fas fa-search"></i> Load Attendance</button>
                <button class="actionBtn markAll" id="markAllBtn" onclick="markAllPresent()"><i class="fas fa-check-double"></i> Mark All Present</button>
            </div>

            <!-- Summary metrics -->
            <div class="attendanceGrid">
                <div class="summaryCard">
                    <h4>Total Students</h4>
                    <div class="num" id="statTotal">0</div>
                </div>
                <div class="summaryCard">
                    <h4>Present</h4>
                    <div class="num" style="color: #4CAF50;" id="statPresent">0</div>
                </div>
                <div class="summaryCard">
                    <h4>Absent</h4>
                    <div class="num" style="color: #f44336;" id="statAbsent">0</div>
                </div>
                <div class="summaryCard">
                    <h4>Late</h4>
                    <div class="num" style="color: #ff9800;" id="statLate">0</div>
                </div>
            </div>

            <!-- Student List Table -->
            <table class="tableContainer">
                <thead>
                    <tr>
                        <th>Register No</th>
                        <th>Student Name</th>
                        <th>Status Selection</th>
                        <th>Student Absence Reason</th>
                    </tr>
                </thead>
                <tbody id="teacherAttendanceTbody">
                    <tr><td colspan="4" style="text-align: center; padding: 20px;">Please select a class and click "Load Attendance".</td></tr>
                </tbody>
            </table>

            <div style="margin-top: 25px; display: flex; justify-content: flex-end;">
                <button class="actionBtn" id="saveAttendanceBtn" style="padding: 12px 25px; font-size: 16px;" onclick="saveTeacherAttendance()"><i class="fas fa-save"></i> Save Attendance Records</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="teacher_attendence.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar("attendance", "teacher");
        });
    </script>
</body>

</html>
