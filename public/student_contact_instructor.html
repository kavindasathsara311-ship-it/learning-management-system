<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Instructors</title>
    <link rel="stylesheet" href="Student_Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .instructorGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .instructorCard {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 20px;
            border-left: 4px solid #00bcd4;
        }

        .instructorAvatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #00bcd4;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        .instructorInfo h3 {
            margin: 0 0 4px 0;
            color: #0f172a;
            font-size: 18px;
        }

        .instructorInfo p {
            margin: 0 0 8px 0;
            color: #64748b;
            font-size: 13px;
        }

        .emailBtn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #00bcd4;
            color: #fff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body id="body">
    <div class="layoutDashboard">
        <div id="sidebar"></div>

        <div class="dashboardContainer DashboardPart" id="dashboardContainer" style="padding: 30px; overflow-y: auto; height: 94vh;">
            <div>
                <h2 style="margin: 0; color: #0f172a;">Course Instructors</h2>
                <p style="color: #64748b; margin-top: 5px;">Contact teachers assigned to your enrolled subjects.</p>
            </div>

            <div class="instructorGrid" id="instructorsContainer">
                <p style="color: #64748b;">Loading instructors...</p>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderSidebar("instructors");
            loadInstructors();
        });

        async function loadInstructors() {
            const token = localStorage.getItem("token");
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE}/api/student-instructors`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                const data = await response.json();
                if (!data.success) return;

                const container = document.getElementById("instructorsContainer");
                container.innerHTML = "";

                if (!data.instructors || data.instructors.length === 0) {
                    container.innerHTML = `<p style="color: #64748b;">No instructors assigned to your enrolled subjects yet.</p>`;
                    return;
                }

                data.instructors.forEach(t => {
                    const card = document.createElement("div");
                    card.className = "instructorCard";
                    card.innerHTML = `
                        <div class="instructorAvatar">
                            <i class="fa fa-user-tie"></i>
                        </div>
                        <div class="instructorInfo">
                            <h3>${t.teacher_name}</h3>
                            <p><i class="fa fa-book" style="color: #00bcd4;"></i> ${t.subject_name}</p>
                            <a class="emailBtn" href="mailto:${t.email}"><i class="fa fa-envelope"></i> ${t.email}</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Error loading instructors:", err);
            }
        }
    </script>
</body>

</html>
